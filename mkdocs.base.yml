site_name: OpenCollab-Eval
site_description: Trustworthy evaluation for OpenCollab-based software engineering agents
repo_name: RISE-X-Lab/OpenCollab-Eval
repo_url: https://github.com/RISE-X-Lab/OpenCollab-Eval
edit_uri: edit/main/
copyright: Copyright © OpenCollab-Eval contributors

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
