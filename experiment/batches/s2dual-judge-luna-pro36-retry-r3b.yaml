# Retry of s2dual-judge-luna-pro36 (G1, gpt-5.6-luna, judge card, N2 pin) rows 3-3: ansible-cd9c4eb5.
#
# Attempt 2 (-retry-r3, 05:09Z on 09-24) stopped validly, but gateway errors ended both Coders for
# good: coder_a at 05:49:46Z and coder_b at 05:51:09Z on `Upstream response stream was interrupted`
# (not on OC's retry list), and neither was woken again. The Adopter had stopped earlier on a loop
# block with 315,225 of its 2,000,000 tokens spent, so a Coder's reply would have woken it: the
# gateway, not the agents, decided how the row ended. Of the seven valid rows with a seat ended by a
# gateway error, this is the one where that could have changed the result (revoke_trace.py, 09-24).
# The lead ruled on 09-24 to rerun it. Rerunning a row the gateway damaged uses none of the three
# attempts, and a gateway failure of this attempt is retried until one succeeds.
#
# If the agents make this attempt fail (such as a revocation), that failure counts: it is the row's
# third counted attempt (attempt 1, the smoke, was revoked), no further attempt is made, and the
# report's merge falls back to attempt 2, the last valid one. At most six luna runs at a time.
# Same fields and pins as G1; merged by `retry_of` (the last valid attempt started wins); named
# -retry-r3b so the review scripts' `<name>-retry-*` glob reads it.
# ---------------------------------------------------------------------------
