# s2dual-judgeinfo-05m on qwen3.8-flash (experiment 3, the budget stated), 09-24.
#
# WHAT IT IS. s2dual-judge -- the reference cell, which commands nothing about
# the two Coders -- with two sentences added at the end of the Adopter's
# capabilities pair (configs/s2dual/capabilities/informed-05m.md):
#   "Your budget for this run is 500,000 tokens, and each Coder's is the same.
#    On these tasks, a single agent working alone used 1,320,000 tokens on
#    average (median 1,470,000)."
# S is the same figure as in the 1M, 2M and 4M cells (Single2 alone on the same
# 36 tasks, s2single-qwen38-tp-pro36). budget_per_seat is the number the card
# states.
#
# WHAT IT IS FOR. The optional scarcest point of the budget gradient (B05 in the
# plan), run at the lead's request on 09-24: s2dual-judgeinfo-1m with the budget
# halved again, on the card and in budget_per_seat alike. At 500,000 the
# Adopter can reach its own cap before it delegates; such a run is censored for
# alpha, not counted as a refusal.
#
# PINS. OC d4e040fa = 4b231b0e (the pin of B1, B2, B4, T1, T2, G1, G2) + the
# 500,000 card and its team file, nothing else; for this cell only the card
# differs from B1's. Eval 3ff64deb, as B1, B2 and B4.
#
# HOST. lthpc-b, the second checkout on the same machine: lthpc stays on
# 4b231b0e for the last luna row of G2 (G2 row 34's reruns), so the two pins
# run side by side without a sync in between. The key file there is a hard
# link to lthpc's.
#
# ENDPOINT. token-plan, key `ca8430b2` (configs/.env.tp3-qwen38), as J', P',
# S1, B1, B2 and B4. If that key runs out, the whole cell moves to
# configs/.env.tp-qwen38 (`e7c28419`) under a new name; no cell mixes two keys.
# ---------------------------------------------------------------------------
name: s2dual-judgeinfo05m-qwen38-tp-pro36
host: lthpc-b
arm: team
cell: s2dual-judgeinfo-05m
suite: pro-mini36-clean
rows: {start: 1, stop: 36}
frame_content: ~/.cache/opencollab-eval/swebench-pro-mini36-clean.jsonl
budget_per_seat: 500000
max_steps: 200
timeout: 5400
concurrency: 36
model_env: configs/.env.tp3-qwen38
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
  OPENCOLLAB_LLM_MAX_RETRIES: "30"
  OPENCOLLAB_PROVIDER_ERROR_TIME_BUDGET: "600"
  OPENCOLLAB_DOCKER_TIMEOUT: "300"
pins:
  opencollab: d4e040fa3017f531649a0059969027350c7401fb
  opencollab_eval: 3ff64deb72b1879449a3f1d11d52fde329088d04
note: "experiment 3: s2dual-judge plus the budget sentence at 500,000 per seat (budget_per_seat 500,000); S as in the 2m anchor"
