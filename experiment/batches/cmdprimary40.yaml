# Ladder rung "primary": the main grid's Team card (facts-v2), which states the facts
# and leaves the choice open. Statement (a) binds on it. Same 40 rows and pins as
# the other four rungs, so the five-rung table sits on one instrument version;
# the frame-wide primary run comes later and supersedes this row.
name: cmdprimary40
host: gpu3
arm: team
rung: primary
cell: facts-v2
suite: subset-50
rows: {start: 1, stop: 40}
budget_per_seat: 2000000
max_steps: 100
timeout: 5400
concurrency: 6
model_env: configs/.env
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
pins:
  opencollab: b00f256995e321e910a988908842705177d4c0f4
  opencollab_eval: 315a06c3df10dcde3d0218a3a3b6a6b157ee12b1
note: "ladder rung primary (facts-v2, choice left open); statement (a) binds, alpha <= 0.2, refuted when the lower 95% bound exceeds 0.2"
