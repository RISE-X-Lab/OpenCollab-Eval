# s2sc-judge-bypass, smoke round 1 (09-24): rows 1-12 of the 36 Pro tasks, run
# next to the other topology's smoke on the same rows. What the smoke is for
# is the machinery, not the reading: every seat seated as Single2 with its own
# card, the nine tools on every role, the topology the scheduler records equal
# to the cell's, the cards stating it, messages only along declared edges,
# refusals and stop notices behaving, and the report reading alpha and every
# off the coder and tester seats. Its adherence numbers are not the cell's and
# are not read against the other topology.
#
# THE FAMILY. OpenCollab 3f4ae4c1 adds configs/s2sc: the handoff experiment's
# Analyst, Coder and Tester seated as Single2 (profile single2 on every role,
# Single2's nine-tool bundle on every role, the Tester included), with the
# judge block byte for byte s2dual's. The two cells differ in exactly one
# directed edge, coder -> analyst: s2sc-judge-bypass has analyst->coder,
# coder->analyst, coder->tester, tester->analyst; s2sc-judge-pipeline has the
# same without coder->analyst. In both, only the Coder can ask the Tester
# anything.
#
# HELD TO s2dual-judge (J'): model qwen3.8-flash on token-plan with key
# ca8430b2 (configs/.env.tp3-qwen38), reasoning_effort max, 2,000,000 per
# seat, 200 steps, 5400 s wall clock, the same env. OC 3f4ae4c1 = d4e040fa
# (the B05 pin) + the s2sc cards and the renderer's peer cards, nothing in the
# runtime. Eval 36bbb22 = 3ff64deb + the s2sc cell prefix.
#
# HOST. lthpc-b, the second checkout, synced to these pins after the last luna
# row's driver exits (sync refuses while any driver on the machine is alive).
# The key file there is a hard link to lthpc's. The two smoke specs run at the
# same time, 24 runs in all, under the key's rate limit.
# ---------------------------------------------------------------------------
name: s2sc-judge-bypass-qwen38-tp-smoke1
host: lthpc-b
arm: team
cell: s2sc-judge-bypass
suite: pro-mini36-clean
rows: {start: 1, stop: 12}
frame_content: ~/.cache/opencollab-eval/swebench-pro-mini36-clean.jsonl
budget_per_seat: 2000000
max_steps: 200
timeout: 5400
concurrency: 12
model_env: configs/.env.tp3-qwen38
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
  OPENCOLLAB_LLM_MAX_RETRIES: "30"
  OPENCOLLAB_PROVIDER_ERROR_TIME_BUDGET: "600"
  OPENCOLLAB_DOCKER_TIMEOUT: "300"
pins:
  opencollab: 3f4ae4c16ce74d29df2cb8cfd9e7cb48bc645c7e
  opencollab_eval: 36bbb22e00ea4ca66187a0918275f4409baa60ad
note: "self-collaboration smoke round 1, topology bypass: the handoff roles seated as Single2 over the bypass topology, judge block, rows 1-12; machinery check only, not a reading of the cell"
