# Single arm on the replication subset, rows 1-50: the paired baseline for every
# ladder rung (rows 1-40 are the five rungs' tasks) and the subset's first Single
# repetition, fixed in advance. Same pins as the ladder so that ITT/PP/CACE per
# rung sit on one instrument version. The frame-wide Single run follows.
name: single-subset50
host: gpu3
arm: single
suite: subset-50
rows: {start: 1, stop: 50}
budget_per_seat: 2000000
max_steps: 100
timeout: 5400
concurrency: 10
model_env: configs/.env
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
pins:
  opencollab: b00f256995e321e910a988908842705177d4c0f4
  opencollab_eval: 315a06c3df10dcde3d0218a3a3b6a6b157ee12b1
note: "Single on subset-50 rows 1-50; paired baseline for the ladder (rows 1-40) and the subset's first repetition"
