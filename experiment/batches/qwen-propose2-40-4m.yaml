# An intervention cell at the 4M operating point: `cmd-plain` with the Analyst's
# closing block changed and nothing else, on the same forty-task list, the same
# suite, the same endpoint and the same scoring dataset as `qwen-plain40-4m`.
#
# WHAT DIFFERS FROM qwen-plain40-4m, EXHAUSTIVELY
#
#   cell            cmd-plain -> cmd-propose2
#   opencollab pin  7051275497d9 -> 02959c3fc059
#   host file       lthpc -> lthpc-c
#
# That second host file is the same machine, the same workdir, the same python, the same
# docker daemon and the same scoring dataset as `lthpc`: a second pair of git
# checkouts and nothing else, asserted field by field by
# `test_the_second_lthpc_checkout_is_the_same_machine`. It exists because a
# checkout sits at one commit and `sync` refuses to move the one a running
# driver is using -- with a single pair, this cell could not start until
# `qwen-plain40-4m` had finished its last thirty-two runs.
#
# The pin is the running cell's own pin with two commits cherry-picked onto it,
# one per intervention cell, so `git diff` between the two pins is seven added
# files and no deletion. A run loads one team file: the other cell's files are
# inert bytes in the checkout. One pin rather than two because the host has one
# checkout and `sync` refuses to move it while a driver is alive.
#
# The Coder's card, the Tester's card, the shared body, all three tool bundles
# and the six directed edges are byte for byte the running cell's. Proof to
# check in the metrics of every run here: `role_prompt_sha256.analyst` =
# 9d6c83a599b2a9912fbbe0e2305973ad6827c767a34cb9742e18255807f57a10, against
# e8353bd71aed5846617d590ec134529ce78f2c4fe95281997d4e09a4186c5771 for
# cmd-plain; `.coder` = 3e2f7cab06d9... and `.tester` = 6a85260af189...
# unchanged.
#
# WHY THIS PARAGRAPH
#
# `cmd-propose` asked the coder for an independent diagnosis and did not say
# when to report. Its own six-run smoke measured what that costs: in three of
# six runs the coder ended `budget exhausted before model call` at 3.91-3.96M
# with `message_agent` called zero times, where under `cmd-plain` -- handed a
# change to make rather than a problem to solve -- the same seat finished in
# 0.65M. The tester was never addressed at all in two of six. A reply reached
# the analyst in three of six, against the five the gate asks for.
#
# A seat that runs out delivers nothing. The wind-down actuator that would force
# a commit inside a reserve is behind `_apply_enforcement_gate` and enforcement
# is off in these runs (`session_run.py:545`), so a seat that crosses its cap
# stops before its next model call and whatever it had dies in its worktree.
#
# So this card asks for a bounded contribution -- commit and send the sha as soon
# as the change applies and runs, improve afterwards -- and makes the tester call
# unconditional: send every sha you hold, even if the only one is your own.
#
# The two `cmd-propose` rows that resolved without any inbound teammate message
# (`matplotlib-25775`, `sphinx-10673`) are the reason its dV of 4 is not read as
# evidence for the mechanism: on those two the analyst worked alone.
#
# WHAT THIS CELL MAY NOT BE USED FOR
#
# No adherence number: the card prescribes the `message_agent` calls, so a
# delegation count here is compliance with the file and not a choice, and α is
# defined on cards that leave the alternative open. Not a rung of the command
# ladder and not poolable with one.
#
# READ-OUT, WRITTEN BEFORE THE RUN
#
# The comparison is against Single at the same operating point
# (`qwen-single40-4m-dash`, same endpoint, same forty tasks, 4M per seat), with
# `qwen-plain40-4m` as the team card this one is a one-block edit of.
#
#   this cell > Single        -> the goal is met. Report the pair per task: b,
#                                c, the exact two-sided sign test, and both
#                                arms' token cost.
#   > cmd-plain but <= Single -> the exchange helps the team and the team still
#                                does not beat one agent. Report both contrasts;
#                                reporting the gain over cmd-plain alone would
#                                be the selective reading this project has
#                                refused elsewhere.
#   <= cmd-plain              -> prescribing the exchange does not pay.
#
# Either arm's gold control short of 40/40 -> no resolve may be read at all.
#
# Cost is part of the answer: this cell spends three seats to answer one agent's
# question, and a win that costs 3x is a different claim from a win.
name: qwen-propose2-40-4m
host: lthpc-c
arm: team
rung: propose2
cell: cmd-propose2
suite: subset-50
rows: {start: 1, stop: 40}
budget_per_seat: 4000000
max_steps: 200
timeout: 10800
concurrency: 6
model_env: configs/.env.qwen
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
pins:
  opencollab: 02959c3fc059bafd6941c72f62502d44017a0b31
  opencollab_eval: dfc88219226b97c7c037104f6444e0b3364400f7
note: "the forty-task measurement of the cmd-propose2 card at the 4M per-seat operating point; one block of the Analyst card apart from qwen-plain40-4m, and compared against qwen-single40-4m-dash"
