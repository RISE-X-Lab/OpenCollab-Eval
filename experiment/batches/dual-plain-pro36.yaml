# dual-plain: G22's two-candidate organization seated as a measurable team, on the
# SWE-bench Pro mini-36 whose repositories the solver-repo sanitize leaves intact.
#
# THE CELL. The division of labour stated as fact, with no prohibition attached. One move
# down from `dual-prohibit`: the sentence forbidding self-implementation is gone
# and nothing else changes.
#
# THE ROSTER. An Adopter (the entry seat) and two Coders, `coder_a` and `coder_b`.
# The Adopter can reach both; the two Coders cannot reach each other, so the
# Adopter is the only channel between them. The card asks for them one at a
# time: brief the first, wait for its answer, then write the second its own
# brief. What goes into that second brief is the Adopter's -- what it learned
# from the first is its to use or to leave out -- and which of the two answers
# the run delivers is its choice too.
#
# THREE THINGS THIS IS NOT.
#   * Not best-of-2. The two candidates are not independent: the second is
#     briefed by an Adopter that has already read the first.
#   * Not G22's relay. G22 forwards the first agent's output; here the Adopter
#     writes the second brief itself, and nothing prescribes what crosses.
#   * Not poolable with the handoff ladder. Same five moves, different roster;
#     the two families are separate instruments and their cells do not pool.
#
# THE ADHERENCE NUMBER IS NOT READABLE FROM `summary.alpha`, AND THE FAILURE IS
# SILENT. `cell_report.py` derives the delegate seats from the literal names
# `coder` and `tester`; this roster matches neither, so alpha reads 0.000 and a
# Clopper-Pearson interval is printed around it anyway. Read the per-seat spend
# and the `message_agent` counts, not that field, until it derives the delegate
# seats from the run's own `assigned.topology_nodes.entry_role`.
#
# WHAT IS HELD EQUAL WITH `pro-mini36-clean`. Every field below except `name`,
# `cell` and the OpenCollab pin is that batch's, to the letter -- same 36 rows,
# same frame content, same budget, same model env -- so a difference between
# this cell and that one is a difference between two cards.
#
# CONCURRENCY IS 6, THE SAME AS THAT BATCH'S. It was 12 for one smoke, and the
# smoke answered: two of twelve rows died at 94 s with the snapshot step's
# `docker exec` crossing its 60 s timeout, before any agent ran. Twelve
# containers doing that at once against one daemon is what crosses it. The
# timeout is settable (`OPENCOLLAB_DOCKER_TIMEOUT`), but raising it is a change
# to `env` and so to `spec_identity`, while concurrency is deliberately outside
# it -- a resume may use a different one because it is not a treatment. So this
# is the field that moves.
#
# THE MODEL IS NOT THE GRID'S, AND NEITHER IS THE ENDPOINT. This family runs on
# the 47.100.35.241 gateway, which serves qwen3.8-flash, deepseek-v4-flash and
# deepseek-v4.1-flash from one key, so the three models of this sweep differ in
# the model and in nothing else. That is the whole reason for the choice: the
# grid's qwen cells were split across dashscope and a private gateway, and no
# one can now say whether a difference between two of them is the card or the
# endpoint. Resolve counts here are comparable across the three models of this
# sweep and with nothing else.
#
# SURVIVING A GATEWAY THAT WOBBLES. `OPENCOLLAB_LLM_MAX_RETRIES` is 30 against a
# default of 3, and `OPENCOLLAB_PROVIDER_ERROR_TIME_BUDGET` is 600 against a
# default of 0. The two must move together: the 60 s ceiling on exponential
# backoff (`adapters/llm/retry.py`) applies only when a time budget exists, so
# raising the retry count alone would let the twentieth backoff sleep for days
# and silently spend the run's whole wall clock. With both set, a seat absorbs
# up to ten minutes of 502s and carries on; past that it ends on a provider
# error, which `cell_report` excludes rather than counts.
name: dual-plain-pro36
host: lthpc
arm: team
cell: dual-plain
suite: pro-mini36-clean
rows: {start: 1, stop: 36}
frame_content: ~/.cache/opencollab-eval/swebench-pro-mini36-clean.jsonl
budget_per_seat: 2000000
max_steps: 100
timeout: 5400
concurrency: 6
model_env: configs/.env.gw2-qwen
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
  OPENCOLLAB_LLM_MAX_RETRIES: "30"
  OPENCOLLAB_PROVIDER_ERROR_TIME_BUDGET: "600"
pins:
  opencollab: 76c6676a2f661242598230c6265a012b9fe8e9d6
  opencollab_eval: dfc88219226b97c7c037104f6444e0b3364400f7
note: "probe only, not a paper cell: the two-candidate roster on SWE-bench Pro mini-36; scoring is the official Pro evaluator, not `batch score`; no adherence number may be read from `summary.alpha` for this roster"
