# s2dual-plain on deepseek-v4.1-flash (experiment 2, the second model), 09-22.
#
# WHAT IT IS FOR. The prompt effect on the qwen3.8-flash cells is one cut, not
# a ladder: alpha separates judge from every commanding rung (paired p<=0.0023)
# and the commanding rungs from each other not at all. So the second model runs
# only the two ends that matter -- judge (commands nothing) and plain (the
# positive control of the frozen rule) -- and this is the plain half; the other
# half is s2dual-judge-dsv41f-tp-pro36, same pins, same key, same timeout.
#
# PINS. OC 35c2eccc, the pin of the qwen re-runs: it carries 6df000c8, which
# registers deepseek-v4.1-flash's 1,000,000-token window (unregistered, the
# window fell back to the family prefix 64,000 and auto_compact ate 67% of
# wall-clock), and the stop notice. Eval dc32491 -- the Single2 single-arm
# plumbing, inert for a team spec, so no checkout move is needed after S1.
#
# TIMEOUT 7200, NOT 5400. At max reasoning the v4.1-flash pilots hit 5400 s in
# 3 of 3 runs even with the window fixed. The r2 pilot timelines show both
# Coders mostly start before 7200 s, so adherence is readable; the Adopter's
# final adoption is often cut, so resolve is not judged on these two cells, and
# judge is cut more often than plain -- report the censoring bounds.
#
# ENDPOINT. token-plan, key `e7c28419` (configs/.env.tp-dsv41f), off-peak only.
# ---------------------------------------------------------------------------
