# s2dual-judgeinfo-2m on qwen3.8-flash (experiment 3, the budget stated), 09-23.
#
# WHAT IT IS. s2dual-judge -- the reference cell, which commands nothing about
# the two Coders -- with two sentences added at the end of the Adopter's
# capabilities pair (configs/s2dual/capabilities/informed-2m.md):
#   "Your budget for this run is 2,000,000 tokens, and each Coder's is the same.
#    On these tasks, a single agent working alone used 1,320,000 tokens on
#    average (median 1,470,000)."
# S is Single2 alone on the same 36 tasks (s2single-qwen38-tp-pro36, all 36
# valid runs, report runs[].tokens: mean 1,318,612, median 1,473,200, three
# significant figures). budget_per_seat is the number the card states.
#
# WHAT IT IS FOR. The anchor of the budget gradient. It differs from J'
# (s2dual-judge-qwen38-tp-r2-pro36; same key, same Eval code path, OC differs
# only by the inert additions below and this card) in the two sentences alone,
# so B2 against J' reads what stating the budget does; B1 and B4 differ from B2
# in the budget number and budget_per_seat alone. Primary reading alpha, with
# the Adopter's spend before its first delegation; every_delegate secondary,
# with the stop-cause classification (why_not_every2.py).
#
# PINS. OC 4b231b0e = iclr-2027 at 35c2eccc (the stop notice, the pin of J', P'
# and S1) + knobs-0922: the `adopt` tool, the s2tools card family, the
# gpt-5.6-luna context-window row, and the three budget-informed cards. For an
# s2dual cell all of it is inert but the card itself: `adopt` is seated only by
# the s2tools team files, and the luna row is keyed to that model's exact name.
# Eval 3ff64deb: the s2tools cell prefix on top of dc32491 (the S1 pin); inert
# for s2dual cells.
#
# ENDPOINT. token-plan, key `ca8430b2` (configs/.env.tp3-qwen38), as J', P' and
# S1. If that key runs out, the whole cell moves to configs/.env.tp-qwen38
# (`e7c28419`) under a new name; no cell mixes two keys.
# ---------------------------------------------------------------------------
name: s2dual-judgeinfo2m-qwen38-tp-pro36
host: lthpc
arm: team
cell: s2dual-judgeinfo-2m
suite: pro-mini36-clean
rows: {start: 1, stop: 36}
frame_content: ~/.cache/opencollab-eval/swebench-pro-mini36-clean.jsonl
budget_per_seat: 2000000
max_steps: 200
timeout: 5400
concurrency: 36
model_env: configs/.env.tp3-qwen38
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
  OPENCOLLAB_LLM_MAX_RETRIES: "30"
  OPENCOLLAB_PROVIDER_ERROR_TIME_BUDGET: "600"
  OPENCOLLAB_DOCKER_TIMEOUT: "300"
pins:
  opencollab: 4b231b0e128696768e168521eddb634fd8951927
  opencollab_eval: 3ff64deb72b1879449a3f1d11d52fde329088d04
note: "experiment 3 anchor: s2dual-judge plus the budget sentence at 2,000,000 per seat and S from s2single-qwen38-tp-pro36 (mean 1,320,000, median 1,470,000)"
