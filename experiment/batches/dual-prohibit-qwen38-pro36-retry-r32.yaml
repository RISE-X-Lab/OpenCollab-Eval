# Retry of dual-prohibit-qwen38-pro36, rows 32.
#
# WHY THESE ROWS. On 2026-09-20 between about 11:56 and 12:09 UTC the token-plan
# endpoint answered `429 ... token-plan 1-week quota has been exhausted`. Runs
# that had been alive for anywhere between 943 s and 2429 s all ended inside the
# same half minute, which is an outage's signature rather than a per-run fault;
# `OPENCOLLAB_PROVIDER_ERROR_TIME_BUDGET` is 600, so each seat had already spent
# ten minutes absorbing the refusals before it gave up. The endpoint recovered
# on its own -- three rows launched afterwards finished rc=0, and a single
# completion at 12:55 UTC answered in 1.3 s.
#
# WHY A RETRY AND NOT A RELAUNCH. Each failed run still wrote a prediction row,
# so relaunching the original spec would resume nothing. A retry runs in an
# out-dir of its own and `merge_attempts` folds it back in: an instance reports
# its last attempt that ran, so these rows replace their `failed` attempts and
# no other row of the cell is touched.
#
# WHY THE ROWS ARE SLICED THIS FINELY. The seventeen rows that did run are not
# in any of these ranges. A wider slice would re-run them, and the merge takes
# the later valid attempt, so a good observation would be silently swapped for a
# second sample of the same instance. Ten specs with no waste is the cost of not
# doing that.
#
# Everything a run is paid for -- cell, suite, budget, steps, timeout, model env,
# env, pins -- is the original's; `check_retry` refuses the spec otherwise.
name: dual-prohibit-qwen38-pro36-retry-r32
host: lthpc
arm: team
cell: dual-prohibit
suite: pro-mini36-clean
rows: {start: 32, stop: 32}
frame_content: ~/.cache/opencollab-eval/swebench-pro-mini36-clean.jsonl
budget_per_seat: 2000000
max_steps: 100
timeout: 5400
concurrency: 1
model_env: configs/.env.tp-qwen38
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
  OPENCOLLAB_LLM_MAX_RETRIES: "30"
  OPENCOLLAB_PROVIDER_ERROR_TIME_BUDGET: "600"
  OPENCOLLAB_DOCKER_TIMEOUT: "300"
pins:
  opencollab: 76c6676a2f661242598230c6265a012b9fe8e9d6
  opencollab_eval: 0e04fdb235e52987dcad49c264f563dc8614d70a
retry_of: dual-prohibit-qwen38-pro36
note: "retry of dual-prohibit-qwen38-pro36 rows 32 after a provider outage: RateLimitError 429 token-plan 1-week quota has been exhausted"
