# Smoke test of the reservation fix, Single arm.
#
# subset-50 rows 20-23, the same four tasks as smoke-falsecap-dw and
# smoke-falsecap-team-primary, so the three arms are paired instance for
# instance. Rows 20, 21 and 23 were recorded `stopped` with "budget exhausted
# before model call" in single-subset50; row 22 completed and is the negative
# control.
#
# Everything is byte-identical to single-subset50 except the rows, the
# concurrency and the two pins.
#
# PINS ARE PLACEHOLDERS. Fill both before `plan`.
name: smoke-falsecap-single
host: gpu3
arm: single
suite: subset-50
rows: {start: 20, stop: 23}
budget_per_seat: 2000000
max_steps: 100
timeout: 5400
concurrency: 4
model_env: configs/.env
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
pins:
  opencollab: 9175297ed56be6a0377b38d6f5949e07d34d7073
  opencollab_eval: d0f5766c1542cbbee06c490e829aae8dc11d8505
note: "smoke test of the reservation fix: subset-50 rows 20-23; rows 20/21/23 were stopped by the pre-call reservation in single-subset50, row 22 is the uncapped negative control; same settings as single-subset50, new pins"
