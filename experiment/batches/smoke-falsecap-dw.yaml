# Smoke test of the reservation fix, Dynamic Workflow arm.
#
# subset-50 rows 20-23, the frozen suite, no new task list. Rows 20, 21 and 23
# (sympy-15875, matplotlib-25775, astropy-14369) are the three tasks whose
# analyst was stopped by the pre-call reservation ("budget exhausted before
# model call") in ALL THREE arms, so the same three specs run in dw / single /
# team compare instance for instance. Row 22 (django-13933) was not capped in
# any arm and completed cheaply everywhere; it rides along as a free negative
# control that must stay completed and stay cheap.
#
# Everything a run is charged with is byte-identical to dw-subset50 except the
# rows, the concurrency and the two pins: same arm, same seat budget, same
# steps, same timeout, same model file, same three switches. Only the code
# changes.
#
# PINS ARE PLACEHOLDERS. The fix is not committed yet; fill both with the
# 40-char shas of the commits that carry it before `plan`.
name: smoke-falsecap-dw
host: gpu3
arm: self-collaboration
suite: subset-50
rows: {start: 20, stop: 23}
budget_per_seat: 2000000
max_steps: 100
timeout: 5400
concurrency: 4
model_env: configs/.env
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
pins:
  opencollab: 9175297ed56be6a0377b38d6f5949e07d34d7073
  opencollab_eval: d0f5766c1542cbbee06c490e829aae8dc11d8505
note: "smoke test of the reservation fix: subset-50 rows 20-23; rows 20/21/23 were false-capped in all three arms, row 22 is the uncapped negative control; same settings as dw-subset50, new pins"
