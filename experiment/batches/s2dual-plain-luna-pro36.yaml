# s2dual-plain on gpt-5.6-luna (experiment 2, the third model), 09-23.
#
# WHAT IT IS. The commanding cell plain (the positive control of the frozen rule) of the s2dual family, as J'/P' on qwen3.8-flash and
# D1/D2 on deepseek-v4.1-flash, on gpt-5.6-luna. Every field the family rests on
# -- the 36 rows, the frame content, budget_per_seat 2M, max_steps 200, the env
# block, the cards -- is the qwen cells'; model_env, timeout and concurrency move.
#
# ENDPOINT AND WHAT A DIFFERENCE MEANS. The private gateway (configs/.env.gw2-luna,
# key `ad30c9bd`, http://47.100.35.241/v1) -- a different endpoint and account
# from token-plan, so luna against qwen or deepseek differs in model, endpoint
# and account at once. Read luna as its own judge/plain pair.
#
# CONCURRENCY 6. On 09-21 this gateway refused the family en masse: a luna cell
# at concurrency 24 came back 34/36 `failed`, a smoke at 12 came back 10/12,
# on `Concurrency limit exceeded for user` and `gateway_queue_full`; the
# refusals ran for the whole batch. Single calls answered in 3-14 s on 09-22
# 17:43-20:04 UTC. A 3-row smoke goes first; `failed` must be 0 before the rest.
#
# CONCURRENCY 18 WAS REFUSED (09-23). On the owner's word the G1 rest resumed at 18 at
# 20:45 UTC after a short-request probe answered 18/18 with 200; within 25 minutes 8 of the
# 12 rows that came back had failed on `APIError: Concurrency limit exceeded for user`
# (provider retries run up to 600 s, so the refusals surface late). Stopped at 21:08 UTC;
# back to 6. A short probe passing N is not a long run passing N: raise this only after the
# gateway's per-user limit is raised, and watch refusal_scan.sh for the first 30 minutes.
#
# TIMEOUT 7200, as the deepseek cells: this endpoint is slower per call, and
# the wall clock is a censoring bound to report, not a treatment.
#
# CONTEXT WINDOW. OC 4b231b0e registers gpt-5.6-luna at 272,000 (the owner's
# figure, 09-22; a probe that day answered 273,010 input tokens with 200).
# Unregistered, the model had no window and history compaction never fired on
# window pressure. Runs made before this row are not pooled with these.
#
# PINS. OC 4b231b0e (iclr-2027: the stop notice + knobs-0922), Eval 3ff64deb.
# ---------------------------------------------------------------------------
