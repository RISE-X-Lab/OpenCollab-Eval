# s2sc-judge-bypass, full cell: all 36 Pro tasks at concurrency 36, one cell at a time
# on the key. The family is two blocks (judge, plain) over two topologies
# (bypass, pipeline); what is read is the two topologies under one block,
# paired by task -- every and alpha, exact two-sided sign test on the
# discordant pairs, as for the s2dual cells. Written down before any full
# run: every higher in pipeline than in bypass under both blocks, alpha close
# between the two, and the gap larger under plain, where the Analyst is asked
# to hand the Coder the implementation.
#
# THE CELL. the judge block, byte for byte s2dual's: nothing tells any seat what order to
# work in or whom to involve.
# Topology: analyst->coder, coder->analyst, coder->tester, tester->analyst: the Coder can report
# to the Analyst directly or hand its commit to the Tester first.
#
# HELD TO s2dual-judge (J'): model qwen3.8-flash on token-plan with key
# ca8430b2 (configs/.env.tp3-qwen38), reasoning_effort max, 2,000,000 per
# seat, 200 steps, 5400 s wall clock, the same env. Every seat is Single2 and
# holds Single2's nine-tool bundle, the Tester included. OC ec89629f =
# 3f4ae4c1 (the judge smoke's pin) + the plain block and its two cells' cards
# and team files; the judge cells' cards and team files are the same bytes as
# at 3f4ae4c1, and nothing in the runtime changed. Eval 36bbb22 = 3ff64deb +
# the s2sc cell prefix.
#
# HOST. lthpc-b. Read adherence from `summary.every_delegate_rate` (Coder and
# Tester both spent tokens and spoke); `summary.alpha` is satisfied by the
# Coder alone.
# ---------------------------------------------------------------------------
name: s2sc-judge-bypass-qwen38-tp-pro36
host: lthpc-b
arm: team
cell: s2sc-judge-bypass
suite: pro-mini36-clean
rows: {start: 1, stop: 36}
frame_content: ~/.cache/opencollab-eval/swebench-pro-mini36-clean.jsonl
budget_per_seat: 2000000
max_steps: 200
timeout: 5400
concurrency: 36
model_env: configs/.env.tp3-qwen38
env:
  OPENCOLLAB_LLM_STREAM_CHAT: "true"
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"
  OPENCOLLAB_LLM_MAX_RETRIES: "30"
  OPENCOLLAB_PROVIDER_ERROR_TIME_BUDGET: "600"
  OPENCOLLAB_DOCKER_TIMEOUT: "300"
pins:
  opencollab: ec89629f3e1dbc7f4f3a52e03ce5966ee759139f
  opencollab_eval: 36bbb22e00ea4ca66187a0918275f4409baa60ad
note: "self-collaboration full cell, judge block, topology bypass: the handoff roles seated as Single2 on SWE-bench Pro mini-36; read adherence from summary.every_delegate_rate"
