# Retry of qwenmax-cmdprimary28-tp, suite rows 23-37 (15 runs).
#
# Why these runs are being re-run. Between 10:24 and 10:48 UTC on 2026-09-13 the
# token-plan endpoint stopped answering. Twenty-one of that batch's twenty-seven
# runs died with the same reason -- 'GenerationTimeoutError: LLM generation
# exceeded the 600.0s per-call timeout' -- and fourteen of them died on their
# very first LLM call, at zero tokens and one step. Runs that finished before
# 10:24 (279s, 1352s, 2806s) and after 10:53 (579s, 987s) were normal, and a
# live probe at 11:26 UTC returned http 200 in 1.64s with echoed_model
# 'qwen3.8-max'. The failure is therefore a property of the path, not of this
# model or of these tasks, which is the condition under which this project
# re-runs rather than records. The failed runs did write prediction rows, so a
# plain resume would skip them; that is why this is a separate out-dir.
#
# Of the 15 runs here, 14 produced zero tokens (never reached the model) and
# 1 died mid-run with tokens already spent. For the second group the first
# attempt is discarded whole: report merges on the last attempt that actually
# ran, and an attempt with runtime_status 'failed' does not count as one.
#
# Read-out, written before the run.
#   - These rows carry no separate interpretation. They exist to restore the
#     denominator of qwenmax-cmdprimary28-tp, and are read only through that
#     batch's own read-out (delivered <=2/28 merge; 3-5/28 note the split
#     denominator; >=6/28 do not merge).
#   - If a run here fails the same way again, it stays infra_failed and leaves
#     the denominator short. A cell that comes out below 28 valid runs is NOT
#     forty tasks: report the true denominator and say so in Deviations. Do not
#     quietly divide by forty.
#   - Concurrency is 6 across the three retry specs (4 here plus 1+1), down from
#     the 9 that was in flight when the endpoint stalled. That is a cost-control
#     choice, not a claim that load caused the stall; this batch cannot tell the
#     two apart.
