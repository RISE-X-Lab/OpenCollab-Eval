# r2: the post-fix rerun of this batch, into a directory of its own.
#
# Why it is rerun: opencollab 9175297e corrects the pre-call reservation
# that counted discarded reasoning text toward the input a seat had to
# reserve, and the stop it produced ended 78 of the 310 runs on record -- 10
# of this batch's 30 -- at a cap the seat had not reached.
#
# Why the name is new: `--out-dir` is the spec's `name` (batch_spec.py:379).
# Left as `cmdplain30` the driver would reopen the directory those runs are
# in, whose `preds-team.jsonl` already names every instance of the slice,
# and would plan zero runs (gen_prediction_batch.py:250-271, :426-427,
# :471-473); the new pins would then also fail pre-flight's out-dir check
# against that directory's batch.json (batch_remote.py:317). Under
# `cmdplain30-r2` nothing is resumed and nothing on record is overwritten.
#
# Every other field is byte-identical to `cmdplain30.yaml` -- same arm, same
# rows of the same suite, same seat budget, steps, timeout, concurrency,
# model file and the same three switches -- so the only difference between
# this batch and the one it replaces is the code. The comment and the `note`
# below are the old spec's, unedited, for the same reason.
#
# The first ladder batch of 2026-09-02: rung cmd-plain on the first 30 rows of
# the replication subset. Launched by hand that morning, before this launcher
# existed; the spec reproduces its command line and its instance file byte for
# byte (pinned in tests/test_batch_launcher.py), so a later resume or a sibling
# rung starts from the same written-down inputs.
name: cmdplain30-r2
host: gpu3
arm: team
rung: plain
cell: cmd-plain
suite: subset-30
rows: {start: 1, stop: 30}
budget_per_seat: 2000000
max_steps: 100
timeout: 5400
concurrency: 6
model_env: configs/.env            # relative to the OpenCollab checkout on the host
env:                               # quote every value: YAML reads off/true as booleans
  OPENCOLLAB_LLM_STREAM_CHAT: "true"      # reasoning text is only captured from the stream
  OPENCOLLAB_REASONING_EFFORT: "max"
  OPENCOLLAB_WRITE_NUDGE_MODE: "off"      # the nudge commands an action that competes with delegating
pins:
  opencollab: 9175297ed56be6a0377b38d6f5949e07d34d7073
  opencollab_eval: 898d5807305edbac17917ad18a2dafc85dae7487
note: ladder rung cmd-plain, first 30 of subset-50; the remaining 10 rows are a separate spec
