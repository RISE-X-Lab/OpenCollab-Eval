# Retry of dual-plain-qwen38-pro36, row 30.
#
# WHY. The token-plan account's weekly quota ran out at about 16:40 UTC on
# 2026-09-20 (`429 insufficient_quota`, reset 09-20 19:49:00 UTC). Seven of the
# cell's thirty-six runs ended `failed` on it, and `failed` is in
# `INVALID_STATUSES`, so those seven instances leave every denominator. The
# cell's other twenty-nine rows ran before the wall and are untouched.
#
# WHY ONE SPEC PER ROW. The seven rows are not contiguous, and `rows` takes a
# single {start, stop} range. A wider slice would re-run rows that already
# ran, and `merge_attempts` reports an instance's *last attempt that ran*, so a
# good observation would be silently replaced by a second sample of the same
# instance. Seven slices with no waste is the price of not doing that.
#
# These may all be launched at once: container ownership labels and the
# per-out-dir `.opencollab` state directory isolate concurrent batches, and ten
# such retries ran together on 2026-09-20 with nothing lost.
#
# Everything a run is paid for is the original's; `check_retry` refuses it
# otherwise.
name: dual-plain-qwen38-pro36-retry-r30
host: lthpc
arm: team
cell: dual-plain
suite: pro-mini36-clean
rows: {start: 30, stop: 30}
frame_content: ~/.cache/opencollab-eval/swebench-pro-mini36-clean.jsonl
