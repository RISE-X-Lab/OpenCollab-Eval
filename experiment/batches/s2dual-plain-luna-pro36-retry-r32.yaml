#
# Attempt 1 (the main batch at concurrency 10, 02:13-04:13Z on 09-24) stopped validly, but on the
# 7,200 s wall clock, after running mostly through the luna gateway's slowdown from 02:42Z (output
# per call fell from 27-33 to 9-11 tokens/s and streams were cut; the Adopter's session at 02:43:46Z
# and coder_a's at 02:55:23Z ended on `Upstream response stream was interrupted` and were woken
# again (10 and 4 more calls)).
# In healthy gateway time luna rows do not reach the wall clock (G1 0/36).
# The lead ruled on 09-24 that this wall-clock stop is the gateway's problem and to rerun the row.
# Rerunning a row the gateway damaged uses none of the three attempts, and a gateway failure of this
# attempt is retried until one succeeds.
#
# If the agents make this attempt fail (such as a revocation), no further attempt is made and the
# report's merge falls back to attempt 1, the last valid one. At most six luna runs at a time.
# Same fields and pins as G2; merged by `retry_of` (the last valid attempt started wins); named
# -retry-r32 so the review scripts' `<name>-retry-*` glob reads it.
# ---------------------------------------------------------------------------
