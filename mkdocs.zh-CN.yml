INHERIT: mkdocs.base.yml

site_url: https://rise-x-lab.github.io/OpenCollab-Eval/zh-CN/
docs_dir: docs/zh-CN
site_dir: site/zh-CN

theme:
  language: zh

extra:
  alternate:
    - name: English
      link: /OpenCollab-Eval/en/
      lang: en
    - name: 简体中文
      link: /OpenCollab-Eval/zh-CN/
      lang: zh

plugins:
  - search:
      lang:
        - en
        - zh

nav:
  - 首页: README.md
  - 快速入门: getting-started.md
  - 使用指南:
      - 任务格式: task-formats.md
      - SWE Pro-Lite 操作: swe-prolite-operations.md
      - CLI 参考: cli-reference.md
      - 故障排查: troubleshooting.md
  - 核心概念:
      - 架构: architecture.md
      - 评测运行时: evaluation-runtime.md
      - 评测完整性: evaluation-integrity.md
      - 最终报告契约: final-report.md
  - 设计与验证:
      - 可信候选构造: design/trusted-candidate-construction.md
      - 确定性 SWE 端到端测试: testing/deterministic-swe-e2e.md
