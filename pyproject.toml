[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "opencollab-eval"
version = "0.5.0"
description = "Independent evaluation layer for OpenCollab solvers."
readme = "README.md"
requires-python = ">=3.10"
license = "MulanPSL-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "OpenCollab-Eval contributors" }]
maintainers = [{ name = "RISE-X-Lab" }]
keywords = ["evaluation", "llm", "software-engineering", "swe-bench", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# OpenCollab is developed alongside this repository and installed from a
# checkout, never from an index: every environment that runs this code points
# at a working tree. A version range here would name an index release that
# carries the API this code calls, and no such release exists -- the published
# 0.5.0 predates `opencollab.environments.build_repo_map_via_env`, which
# generation now calls on both arms. Naming the package without a bound keeps
# the dependency direction declared without asserting a release that is not
# there. The compatibility check that does have something real to check lives
# in `swe_v1_runtime_source.py`, which reads the version out of the checkout
# it is about to ship to a remote runtime.
dependencies = ["opencollab"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5"]
swebench = ["swebench>=4,<5", "docker>=7"]
openhands = ["openhands==1.16.0; python_version == '3.12'"]

[project.urls]
Homepage = "https://github.com/RISE-X-Lab/OpenCollab-Eval"
Repository = "https://github.com/RISE-X-Lab/OpenCollab-Eval"
Issues = "https://github.com/RISE-X-Lab/OpenCollab-Eval/issues"
Security = "https://github.com/RISE-X-Lab/OpenCollab-Eval/security/policy"

[project.scripts]
oc-eval = "opencollab_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencollab_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
