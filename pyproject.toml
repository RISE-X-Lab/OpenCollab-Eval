[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencollab-eval"
version = "0.1.0"
description = "Independent evaluation layer for OpenCollab solvers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["opencollab>=0.3,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5"]
swebench = ["swebench>=4,<5", "docker>=7"]

[project.scripts]
oc-eval = "opencollab_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencollab_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
