INHERIT: mkdocs.base.yml

site_url: https://rise-x-lab.github.io/OpenCollab-Eval/en/
docs_dir: docs
site_dir: site/en
exclude_docs: |
  zh-CN/

theme:
  language: en

extra:
  alternate:
    - name: English
      link: /OpenCollab-Eval/en/
      lang: en
    - name: 简体中文
      link: /OpenCollab-Eval/zh-CN/
      lang: zh

plugins:
  - search:
      lang: en

nav:
  - Home: README.md
  - Getting started: getting-started.md
  - Guides:
      - Task formats: task-formats.md
      - SWE Pro-Lite operations: swe-prolite-operations.md
      - CLI reference: cli-reference.md
      - Troubleshooting: troubleshooting.md
  - Concepts:
      - Architecture: architecture.md
      - Evaluation runtime: evaluation-runtime.md
      - Evaluation integrity: evaluation-integrity.md
      - Final report contract: final-report.md
  - Design and verification:
      - Trusted candidate construction: design/trusted-candidate-construction.md
      - Deterministic SWE end-to-end test: testing/deterministic-swe-e2e.md
