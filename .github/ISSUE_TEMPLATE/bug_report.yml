name: Bug report
description: Report a reproducible OpenCollab-Eval defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities belong in the private process described in
        [SECURITY.md](https://github.com/RISE-X-Lab/OpenCollab-Eval/blob/main/SECURITY.md).
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the command, exit status, and redacted evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove credentials, private paths, and benchmark answers.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: OpenCollab-Eval revision
    validations:
      required: true
