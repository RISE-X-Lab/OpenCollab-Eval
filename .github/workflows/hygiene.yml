name: Repository hygiene

on:
  pull_request:

permissions:
  contents: read

jobs:
  added-files:
    name: Check added files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce added-file limits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          failed=0
          while IFS= read -r -d '' path; do
            [[ -f "$path" ]] || continue
            bytes=$(wc -c < "$path")
            if (( bytes > 512000 )); then
              echo "Added file exceeds 500 KB: $path ($bytes bytes)" >&2
              failed=1
            fi
            if [[ "$path" == *.py ]]; then
              lines=$(wc -l < "$path")
              if (( lines > 800 )); then
                echo "Added Python module exceeds 800 lines: $path ($lines lines)" >&2
                failed=1
              fi
            fi
          done < <(git diff --diff-filter=A --name-only -z "$BASE_SHA" "$GITHUB_SHA")
          exit "$failed"
