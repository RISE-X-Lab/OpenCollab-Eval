name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
        working-directory: eval
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      OPENCOLLAB_SOURCE_ROOT: ${{ github.workspace }}/opencollab-source
      OPENCOLLAB_EVAL_SOURCE_ROOT: ${{ github.workspace }}/eval

    steps:
      - name: Check out OpenCollab-Eval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: eval

      - name: Check out the compatible OpenCollab public API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab
          ref: df4ccb279567761482df2d5f838fdcfc741821c1
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          persist-credentials: false
          path: opencollab-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            eval/pyproject.toml
            opencollab-source/pyproject.toml

      - name: Build both distributions
        id: wheels
        run: |
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/wheels/opencollab" "$RUNNER_TEMP/wheels/eval"
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/opencollab" ../opencollab-source
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/eval" .
          oc_wheels=("$RUNNER_TEMP"/wheels/opencollab/*.whl)
          eval_wheels=("$RUNNER_TEMP"/wheels/eval/*.whl)
          test "${#oc_wheels[@]}" -eq 1
          test "${#eval_wheels[@]}" -eq 1
          echo "opencollab=${oc_wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "eval=${eval_wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: python -m pip install "${{ steps.wheels.outputs.opencollab }}" -e ".[dev,swebench]"

      - name: Run Ruff
        run: ruff check .

      - name: Run the full test suite
        run: pytest -q

      - name: Verify installed wheel and public API compatibility
        if: matrix.python-version == '3.12'
        env:
          OPENCOLLAB_SOURCE_ROOT: ${{ github.workspace }}/opencollab-source
          OPENCOLLAB_EVAL_SOURCE_ROOT: ${{ github.workspace }}/eval
        run: scripts/verify_wheel_contract.sh "${{ steps.wheels.outputs.opencollab }}" "${{ steps.wheels.outputs.eval }}"

  framework-experiments:
    name: Framework experiment instruments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out evaluation inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: eval
          persist-credentials: false
      - name: Check out the framework instrument version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab
          ref: d2736f3adbfbe5da40c080daa59c0c3c7f5b1643
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          path: framework
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the instrument runtime
        run: python -m pip install -e './framework[dev]'
      - name: Check assembly and transferred regressions
        working-directory: eval
        run: |
          python experiment/framework/scripts/analyst_cards.py
          python -m pytest -q -o asyncio_mode=auto experiment/framework/tests

  deterministic-e2e:
    name: Deterministic SWE end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: eval
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out OpenCollab-Eval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: eval

      - name: Check out the compatible OpenCollab public API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab
          ref: df4ccb279567761482df2d5f838fdcfc741821c1
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          persist-credentials: false
          path: opencollab-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eval/pyproject.toml
            opencollab-source/pyproject.toml

      - name: Install SSH and rsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server rsync
          sudo mkdir -p /run/sshd

      - name: Build both distributions
        id: wheels
        run: |
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/wheels/opencollab" "$RUNNER_TEMP/wheels/eval"
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/opencollab" ../opencollab-source
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/eval" .
          oc_wheels=("$RUNNER_TEMP"/wheels/opencollab/*.whl)
          eval_wheels=("$RUNNER_TEMP"/wheels/eval/*.whl)
          test "${#oc_wheels[@]}" -eq 1
          test "${#eval_wheels[@]}" -eq 1
          echo "opencollab=${oc_wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "eval=${eval_wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Run deterministic SWE evaluation
        env:
          OPENCOLLAB_SOURCE_ROOT: ${{ github.workspace }}/opencollab-source
          OPENCOLLAB_E2E_OPENCOLLAB_WHEEL: ${{ steps.wheels.outputs.opencollab }}
          OPENCOLLAB_E2E_EVAL_WHEEL: ${{ steps.wheels.outputs.eval }}
        run: scripts/run_deterministic_swe_e2e.sh --output "$RUNNER_TEMP/deterministic-e2e" --runs 1

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-swe-e2e
          path: ${{ runner.temp }}/deterministic-e2e
          if-no-files-found: error
          retention-days: 14
