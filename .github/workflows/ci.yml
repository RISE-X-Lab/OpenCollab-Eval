name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
        working-directory: eval
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      OPENCOLLAB_SOURCE_ROOT: ${{ github.workspace }}/opencollab-source
      OPENCOLLAB_EVAL_SOURCE_ROOT: ${{ github.workspace }}/eval

    steps:
      - name: Check out OpenCollab-Eval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: eval

      - name: Check out the compatible OpenCollab public API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab
          ref: efc5a3b0f05db9498c84de5ef0c9453aeac1f1e8
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          persist-credentials: false
          path: opencollab-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            eval/pyproject.toml
            opencollab-source/pyproject.toml

      - name: Build both distributions
        id: wheels
        run: |
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/wheels/opencollab" "$RUNNER_TEMP/wheels/eval"
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/opencollab" ../opencollab-source
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/eval" .
          oc_wheels=("$RUNNER_TEMP"/wheels/opencollab/*.whl)
          eval_wheels=("$RUNNER_TEMP"/wheels/eval/*.whl)
          test "${#oc_wheels[@]}" -eq 1
          test "${#eval_wheels[@]}" -eq 1
          echo "opencollab=${oc_wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "eval=${eval_wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: python -m pip install "${{ steps.wheels.outputs.opencollab }}" -e ".[dev,swebench]"

      - name: Run Ruff
        run: ruff check .

      - name: Run the full test suite
        run: pytest -q

      - name: Verify installed wheel and public API compatibility
        if: matrix.python-version == '3.12'
        env:
          OPENCOLLAB_SOURCE_ROOT: ${{ github.workspace }}/opencollab-source
          OPENCOLLAB_EVAL_SOURCE_ROOT: ${{ github.workspace }}/eval
        run: scripts/verify_wheel_contract.sh "${{ steps.wheels.outputs.opencollab }}" "${{ steps.wheels.outputs.eval }}"

  integrity-docker:
    name: Core workspace integrity Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: eval
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out OpenCollab-Eval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: eval

      - name: Check out the compatible OpenCollab public API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab
          ref: efc5a3b0f05db9498c84de5ef0c9453aeac1f1e8
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          persist-credentials: false
          path: opencollab-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eval/pyproject.toml
            opencollab-source/pyproject.toml

      - name: Build both distributions
        id: wheels
        run: |
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/wheels/opencollab" "$RUNNER_TEMP/wheels/eval"
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/opencollab" ../opencollab-source
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/eval" .
          oc_wheels=("$RUNNER_TEMP"/wheels/opencollab/*.whl)
          eval_wheels=("$RUNNER_TEMP"/wheels/eval/*.whl)
          test "${#oc_wheels[@]}" -eq 1
          test "${#eval_wheels[@]}" -eq 1
          echo "opencollab=${oc_wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "eval=${eval_wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Run core workspace integrity smoke
        env:
          OPENCOLLAB_SOURCE_ROOT: ${{ github.workspace }}/opencollab-source
          OPENCOLLAB_EVAL_SOURCE_ROOT: ${{ github.workspace }}/eval
        run: |
          python -m pip install "${{ steps.wheels.outputs.opencollab }}" "${{ steps.wheels.outputs.eval }}[swebench]"
          cd tests
          python -m e2e.integrity_docker_smoke --output "$RUNNER_TEMP/integrity-docker-smoke.json"

      - name: Upload integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-integrity-docker-smoke
          path: ${{ runner.temp }}/integrity-docker-smoke.json
          if-no-files-found: error
          retention-days: 14
